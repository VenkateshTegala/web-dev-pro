<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    .container {
      height: 748px;
      width: 748px;
      display: grid;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 22px;
      gap: 9px;
      background-color: black;

    }
    .box {
      display: flex;
      background-color: green;
      justify-content: center;
      align-items: center;
    }
    .a1 {
      background-color: red;
      order: 1;
      grid-column-start: 1;
      grid-column-end: 2;
      grid-row-start: 1;
      grid-row-end: 2;
    }

    .a2 {
      background-color: bisque;
      order: 2;
      grid-column-start: 2;
      grid-column-end: 5;
      grid-row-start: 1;
      grid-row-end: 2;
    }
    .a3 {
      background-color: bisque;
      order: 3;
      grid-column-start: 1;
      grid-column-end: 2;
      grid-row-start: 2;
      grid-row-end: 4;
    }
    .a4 {
      background-color: bisque;
      order: 4;
      grid-column-start: 2;
      grid-column-end: 4;
      grid-row-start: 2;
      grid-row-end: 4;
    }
    .a5 {
      background-color: blue;
      order: 5;
      grid-column-start: 4;
      grid-column-end: 5;
      grid-row-start: 2;
      grid-row-end: 3;
    }
    .a6 {
      background-color: bisque;
      order: 6;
      grid-column-start: 4;
      grid-column-end: 5;
      grid-row-start: 3;
      grid-row-end: 5;
    }
    .a7 {
      background-color: bisque;
      order: 7;
      grid-column-start: 1;
      grid-column-end: 2;
      grid-row-start: 4;
      grid-row-end: 5;

    }
    .a7 {
      background-color: bisque;
      order: 7;
      grid-column-start: 1;
      grid-column-end: 2;
      grid-row-start: 4;
      grid-row-end: 5;

    }
    .a8 {
      background-color: yellow;
      order: 8;
      grid-column-start: 2;
      grid-column-end: 3;
      grid-row-start: 4;
      grid-row-end: 5;
    }
    .a9 {
      background-color: black;
      order: 9;
      grid-column-start: 3;
      grid-column-end: 4;
      grid-row-start: 4;
      grid-row-end: 5;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="container">
    <div class="a1 box">1</div>
    <div class="a2 box">2</div>
    <div class="a3 box">3</div>
    <div class="a4 box">4</div>
    <div class="a5 box">5</div>
    <div class="a6 box">6</div>
    <div class="a7 box">7</div>
    <div class="a8 box">8</div>
    <div class="a9 box">9</div>
   </div>
</body>

</html>
