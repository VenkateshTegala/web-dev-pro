<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Placement</title>
  <style>
    body {
      padding: 0;
      margin: 0;
    }

    .container {
      height: 100vh;
      display: grid;
      gap: 0.1rem;
      grid-template-columns: 1fr 1fr 2fr;
      grid-template-rows: 1fr 1fr;
    }

    .cowboy {
      grid-column-start: 1;
      grid-column-end: 3;
      order: 0;
    }

    .astronaut {
      grid-column-start: 1;
      grid-column-end: 3;
      order: 3;
    }

    .book {
      grid-column-start: 3;
      grid-column-end: 4;
      grid-row-start: 1;
      grid-row-end: 3;
    }

    .item {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 5rem;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      background-color: blueviolet;
      /* TODO: Use Flexbox to align the text to the center horizontally and vertically. 
      See goal1 image.
      */
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="item cowboy">🤠</div>
    <div class="item astronaut">👨‍🚀</div>
    <div class="item book">📖</div>
  </div>
</body>

</html>
